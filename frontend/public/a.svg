<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <style>
      .t    { font-family: ui-monospace, Menlo, Consolas, monospace; fill:#e2e8f0; }
      .pin  { font-size:13px; }
      .lbl  { font-size:12px; }
      .btn  { font-size:13px; font-weight:700; }
      .wire { fill:none; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="780" fill="#0b1220"/>

  <!-- title -->
  <text x="600" y="42" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="#f1f5f9">
    4-Button HID Macro Keypad &#8212; Arduino Pro Micro (ATmega32U4)
  </text>

  <!-- ================= LEGEND ================= -->
  <rect x="24" y="110" width="240" height="400" rx="10" fill="#111c2e" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="142" class="t" font-size="15" font-weight="700" fill="#f1f5f9">LEGEND</text>
  <text x="44" y="172" class="t lbl">Board: Arduino Pro Micro</text>
  <text x="44" y="196" class="t lbl">MCU: ATmega32U4</text>
  <text x="44" y="220" class="t lbl">Library: HID-Project</text>
  <line x1="44" y1="240" x2="244" y2="240" stroke="#334155"/>
  <text x="44" y="266" class="t lbl">4&#215; SPST tact switches</text>
  <text x="44" y="290" class="t lbl">pinMode: INPUT_PULLUP</text>
  <text x="44" y="314" class="t lbl">Wiring: pin &#8594; SW &#8594; GND</text>
  <text x="44" y="338" class="t lbl">Idle = HIGH / Press = LOW</text>
  <line x1="44" y1="358" x2="244" y2="358" stroke="#334155"/>
  <rect x="44" y="374" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="70" y="386" class="t lbl">D16 &#8594; SW2</text>
  <rect x="44" y="400" width="14" height="14" rx="3" fill="#a78bfa"/>
  <text x="70" y="412" class="t lbl">D3&nbsp;&nbsp;&#8594; SW3</text>
  <rect x="44" y="426" width="14" height="14" rx="3" fill="#fb923c"/>
  <text x="70" y="438" class="t lbl">D5&nbsp;&nbsp;&#8594; SW4</text>
  <rect x="44" y="452" width="14" height="14" rx="3" fill="#34d399"/>
  <text x="70" y="464" class="t lbl">D10 &#8594; SW5</text>
  <rect x="44" y="478" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="70" y="490" class="t lbl">GND rail</text>

  <!-- ================= USB ================= -->
  <rect x="390" y="68" width="80" height="36" rx="5" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <text x="430" y="60" text-anchor="middle" class="t lbl" fill="#9ca3af">USB &#8594; PC</text>

  <!-- ================= BOARD ================= -->
  <rect x="340" y="100" width="180" height="520" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- ---------- LEFT PIN STUBS ---------- -->
  <g stroke="#475569" stroke-width="2">
    <line x1="310" y1="140" x2="340" y2="140"/>
    <line x1="310" y1="180" x2="340" y2="180"/>
    <line x1="310" y1="220" x2="340" y2="220"/>
    <line x1="310" y1="260" x2="340" y2="260"/>
    <line x1="310" y1="300" x2="340" y2="300"/>
    <line x1="310" y1="340" x2="340" y2="340"/>
    <line x1="310" y1="380" x2="340" y2="380"/>
    <line x1="310" y1="420" x2="340" y2="420"/>
    <line x1="310" y1="460" x2="340" y2="460"/>
    <line x1="310" y1="500" x2="340" y2="500"/>
    <line x1="310" y1="540" x2="340" y2="540"/>
    <line x1="310" y1="580" x2="340" y2="580"/>
  </g>
  <g class="t pin">
    <text x="350" y="145">TXO</text>
    <text x="350" y="185">RXI</text>
    <text x="350" y="225" fill="#94a3b8" font-weight="700">GND</text>
    <text x="350" y="265">GND</text>
    <text x="350" y="305">D2</text>
    <text x="350" y="345" fill="#a78bfa" font-weight="700">D3</text>
    <text x="350" y="385">D4</text>
    <text x="350" y="425" fill="#fb923c" font-weight="700">D5</text>
    <text x="350" y="465">D6</text>
    <text x="350" y="505">D7</text>
    <text x="350" y="545">D8</text>
    <text x="350" y="585">D9</text>
  </g>

  <!-- ---------- RIGHT PIN STUBS ---------- -->
  <g stroke="#475569" stroke-width="2">
    <line x1="520" y1="140" x2="550" y2="140"/>
    <line x1="520" y1="180" x2="550" y2="180"/>
    <line x1="520" y1="220" x2="550" y2="220"/>
    <line x1="520" y1="260" x2="550" y2="260"/>
    <line x1="520" y1="300" x2="550" y2="300"/>
    <line x1="520" y1="340" x2="550" y2="340"/>
    <line x1="520" y1="380" x2="550" y2="380"/>
    <line x1="520" y1="420" x2="550" y2="420"/>
    <line x1="520" y1="460" x2="550" y2="460"/>
    <line x1="520" y1="500" x2="550" y2="500"/>
    <line x1="520" y1="540" x2="550" y2="540"/>
    <line x1="520" y1="580" x2="550" y2="580"/>
  </g>
  <g class="t pin" text-anchor="end">
    <text x="510" y="145">RAW</text>
    <text x="510" y="185">GND</text>
    <text x="510" y="225">RST</text>
    <text x="510" y="265">VCC</text>
    <text x="510" y="305">A3</text>
    <text x="510" y="345">A2</text>
    <text x="510" y="385">A1</text>
    <text x="510" y="425">A0</text>
    <text x="510" y="465">15</text>
    <text x="510" y="505">14</text>
    <text x="510" y="545" fill="#38bdf8" font-weight="700">16</text>
    <text x="510" y="585" fill="#34d399" font-weight="700">10</text>
  </g>

  <!-- ================= SIGNAL WIRES ================= -->
  <!-- pin 3 -> SW3 -->
  <path class="wire" stroke="#a78bfa" d="M550 340 L700 340 L700 240 L760 240"/>
  <!-- pin 5 -> SW4 -->
  <path class="wire" stroke="#fb923c" d="M550 420 L730 420 L730 360 L760 360"/>
  <!-- pin 16 -> SW2 -->
  <path class="wire" stroke="#38bdf8" d="M550 540 L670 540 L670 480 L760 480"/>
  <!-- pin 10 -> SW5 -->
  <path class="wire" stroke="#34d399" d="M550 580 L760 580"/>

  <!-- ================= GND NETWORK ================= -->
  <path class="wire" stroke="#94a3b8" d="M310 220 L280 220 L280 700 L920 700"/>
  <path class="wire" stroke="#94a3b8" d="M840 240 L860 240 L860 700"/>
  <path class="wire" stroke="#94a3b8" d="M840 360 L880 360 L880 700"/>
  <path class="wire" stroke="#94a3b8" d="M840 480 L900 480 L900 700"/>
  <path class="wire" stroke="#94a3b8" d="M840 580 L920 580 L920 700"/>
  <circle cx="860" cy="700" r="5" fill="#94a3b8"/>
  <circle cx="880" cy="700" r="5" fill="#94a3b8"/>
  <circle cx="900" cy="700" r="5" fill="#94a3b8"/>
  <text x="600" y="690" text-anchor="middle" class="t lbl" fill="#94a3b8">COMMON GND RAIL</text>

  <!-- ================= SWITCHES ================= -->
  <!-- SW3 -->
  <text x="800" y="192" text-anchor="middle" class="t lbl" fill="#c4b5fd">Win + D</text>
  <text x="800" y="208" text-anchor="middle" class="t lbl" fill="#8b98ab">then types: git push</text>
  <rect x="760" y="215" width="80" height="50" rx="8" fill="#374151" stroke="#a78bfa" stroke-width="2"/>
  <text x="800" y="238" text-anchor="middle" class="t btn">SW3</text>
  <text x="800" y="254" text-anchor="middle" class="t lbl" fill="#9ca3af">D3</text>
  <circle cx="760" cy="240" r="5" fill="#a78bfa"/>
  <circle cx="840" cy="240" r="5" fill="#94a3b8"/>

  <!-- SW4 -->
  <text x="800" y="312" text-anchor="middle" class="t lbl" fill="#fdba74">types: git push</text>
  <text x="800" y="328" text-anchor="middle" class="t lbl" fill="#8b98ab">&#160;</text>
  <rect x="760" y="335" width="80" height="50" rx="8" fill="#374151" stroke="#fb923c" stroke-width="2"/>
  <text x="800" y="358" text-anchor="middle" class="t btn">SW4</text>
  <text x="800" y="374" text-anchor="middle" class="t lbl" fill="#9ca3af">D5</text>
  <circle cx="760" cy="360" r="5" fill="#fb923c"/>
  <circle cx="840" cy="360" r="5" fill="#94a3b8"/>

  <!-- SW2 -->
  <text x="800" y="432" text-anchor="middle" class="t lbl" fill="#7dd3fc">Ctrl + Shift + `</text>
  <text x="800" y="448" text-anchor="middle" class="t lbl" fill="#8b98ab">VS Code terminal</text>
  <rect x="760" y="455" width="80" height="50" rx="8" fill="#374151" stroke="#38bdf8" stroke-width="2"/>
  <text x="800" y="478" text-anchor="middle" class="t btn">SW2</text>
  <text x="800" y="494" text-anchor="middle" class="t lbl" fill="#9ca3af">D16</text>
  <circle cx="760" cy="480" r="5" fill="#38bdf8"/>
  <circle cx="840" cy="480" r="5" fill="#94a3b8"/>

  <!-- SW5 -->
  <text x="800" y="532" text-anchor="middle" class="t lbl" fill="#6ee7b7">types: git add .</text>
  <text x="800" y="548" text-anchor="middle" class="t lbl" fill="#8b98ab">then: git commit -m '</text>
  <rect x="760" y="555" width="80" height="50" rx="8" fill="#374151" stroke="#34d399" stroke-width="2"/>
  <text x="800" y="578" text-anchor="middle" class="t btn">SW5</text>
  <text x="800" y="594" text-anchor="middle" class="t lbl" fill="#9ca3af">D10</text>
  <circle cx="760" cy="580" r="5" fill="#34d399"/>
  <circle cx="840" cy="580" r="5" fill="#94a3b8"/>

  <!-- footer -->
  <text x="600" y="752" text-anchor="middle" class="t lbl" fill="#64748b">
    Each switch: leg 1 &#8594; Arduino pin, leg 2 &#8594; common GND rail. No external resistors required.
  </text>
</svg>