<svg width="1000" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Push Button Switch Symbol -->
    <g id="switch">
      <!-- Left contact -->
      <line x1="0" y1="10" x2="20" y2="10" stroke="#212529" stroke-width="2"/>
      <circle cx="20" cy="10" r="3" fill="#212529"/>
      <!-- Right contact -->
      <line x1="60" y1="10" x2="80" y2="10" stroke="#212529" stroke-width="2"/>
      <circle cx="60" cy="10" r="3" fill="#212529"/>
      <!-- Switch bar -->
      <line x1="20" y1="5" x2="60" y2="5" stroke="#212529" stroke-width="2"/>
      <!-- Actuator -->
      <line x1="40" y1="5" x2="40" y2="0" stroke="#212529" stroke-width="2"/>
      <line x1="30" y1="0" x2="50" y2="0" stroke="#212529" stroke-width="2"/>
      <!-- Terminal labels -->
      <text x="10" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">1</text>
      <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">2</text>
    </g>

    <!-- Ground Symbol -->
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#198754" stroke-width="3"/>
      <line x1="-15" y1="20" x2="15" y2="20" stroke="#198754" stroke-width="3"/>
      <line x1="-10" y1="28" x2="10" y2="28" stroke="#198754" stroke-width="3"/>
      <line x1="-5" y1="36" x2="5" y2="36" stroke="#198754" stroke-width="3"/>
      <text x="0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#198754">GND</text>
    </g>
  </defs>

  <!-- Background and Border -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <rect x="20" y="20" width="960" height="610" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>

  <!-- Title and Subtitle -->
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#212529">Arduino Pro Micro Macro Pad - Wiring Diagram</text>
  <text x="500" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c757d">4x Pushbuttons with Internal Pull-ups</text>

  <!-- Arduino Pro Micro Board -->
  <rect x="150" y="120" width="280" height="300" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="3"/>
  <text x="290" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#495057">ATmega32U4</text>
  <text x="290" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Pro Micro</text>
  
  <!-- USB Port -->
  <rect x="260" y="100" width="60" height="20" rx="4" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
  <text x="290" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#212529">USB</text>
  
  <!-- Arduino Pin Labels -->
  <!-- Left Side -->
  <text x="140" y="215" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#198754">GND</text>
  <line x1="130" y1="220" x2="150" y2="220" stroke="#198754" stroke-width="3"/>
  
  <!-- Right Side -->
  <line x1="430" y1="160" x2="450" y2="160" stroke="#0d6efd" stroke-width="3"/>
  <text x="445" y="155" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">D16</text>
  
  <line x1="430" y1="240" x2="450" y2="240" stroke="#0d6efd" stroke-width="3"/>
  <text x="445" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">D3</text>
  
  <line x1="430" y1="320" x2="450" y2="320" stroke="#0d6efd" stroke-width="3"/>
  <text x="445" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">D5</text>
  
  <line x1="430" y1="400" x2="450" y2="400" stroke="#0d6efd" stroke-width="3"/>
  <text x="445" y="395" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">D10</text>

  <!-- Switches -->
  <!-- Switch 1 (D16) -->
  <use href="#switch" x="730" y="150"/>
  <text x="770" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">SW1</text>
  <rect x="710" y="175" width="120" height="22" rx="4" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="770" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">Ctrl+Shift+`</text>

  <!-- Switch 2 (D3) -->
  <use href="#switch" x="730" y="230"/>
  <text x="770" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">SW2</text>
  <rect x="710" y="255" width="120" height="22" rx="4" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="770" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">Win+D</text>

  <!-- Switch 3 (D5) -->
  <use href="#switch" x="730" y="310"/>
  <text x="770" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">SW3</text>
  <rect x="710" y="335" width="120" height="22" rx="4" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="770" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">git push</text>

  <!-- Switch 4 (D10) -->
  <use href="#switch" x="730" y="390"/>
  <text x="770" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">SW4</text>
  <rect x="700" y="415" width="140" height="36" rx="4" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="770" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">git add .</text>
  <text x="770" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">git commit -m '</text>

  <!-- Signal Wires (Blue) -->
  <line x1="450" y1="160" x2="730" y2="160" stroke="#0d6efd" stroke-width="4"/>
  <line x1="450" y1="240" x2="730" y2="240" stroke="#0d6efd" stroke-width="4"/>
  <line x1="450" y1="320" x2="730" y2="320" stroke="#0d6efd" stroke-width="4"/>
  <line x1="450" y1="400" x2="730" y2="400" stroke="#0d6efd" stroke-width="4"/>

  <!-- Junction Dots for Signal Wires -->
  <circle cx="450" cy="160" r="5" fill="#0d6efd"/>
  <circle cx="450" cy="240" r="5" fill="#0d6efd"/>
  <circle cx="450" cy="320" r="5" fill="#0d6efd"/>
  <circle cx="450" cy="400" r="5" fill="#0d6efd"/>
  
  <circle cx="730" cy="160" r="5" fill="#0d6efd"/>
  <circle cx="730" cy="240" r="5" fill="#0d6efd"/>
  <circle cx="730" cy="320" r="5" fill="#0d6efd"/>
  <circle cx="730" cy="400" r="5" fill="#0d6efd"/>

  <!-- GND Wires (Green) -->
  <line x1="810" y1="160" x2="920" y2="160" stroke="#198754" stroke-width="4"/>
  <line x1="810" y1="240" x2="920" y2="240" stroke="#198754" stroke-width="4"/>
  <line x1="810" y1="320" x2="920" y2="320" stroke="#198754" stroke-width="4"/>
  <line x1="810" y1="400" x2="920" y2="400" stroke="#198754" stroke-width="4"/>

  <!-- GND Rail -->
  <line x1="920" y1="160" x2="920" y2="480" stroke="#198754" stroke-width="4"/>
  
  <!-- Junction Dots for GND Wires -->
  <circle cx="810" cy="160" r="5" fill="#198754"/>
  <circle cx="810" cy="240" r="5" fill="#198754"/>
  <circle cx="810" cy="320" r="5" fill="#198754"/>
  <circle cx="810" cy="400" r="5" fill="#198754"/>

  <circle cx="920" cy="160" r="5" fill="#198754"/>
  <circle cx="920" cy="240" r="5" fill="#198754"/>
  <circle cx="920" cy="320" r="5" fill="#198754"/>
  <circle cx="920" cy="400" r="5" fill="#198754"/>
  <circle cx="920" cy="480" r="5" fill="#198754"/>

  <!-- GND Return Path -->
  <path d="M 920 480 L 920 560 L 80 560 L 80 220 L 130 220" fill="none" stroke="#198754" stroke-width="4"/>
  <circle cx="80" cy="560" r="5" fill="#198754"/>
  <circle cx="80" cy="220" r="5" fill="#198754"/>
  <circle cx="130" cy="220" r="5" fill="#198754"/>
  
  <!-- GND Symbol on Return Path -->
  <use href="#gnd" x="80" y="220"/>

  <!-- Legend -->
  <rect x="60" y="480" width="260" height="110" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="80" y="505" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Legend</text>
  
  <line x1="80" y1="525" x2="120" y2="525" stroke="#0d6efd" stroke-width="4"/>
  <text x="130" y="530" font-family="Arial, sans-serif" font-size="14" fill="#212529">Signal (Input)</text>
  
  <line x1="80" y1="550" x2="120" y2="550" stroke="#198754" stroke-width="4"/>
  <text x="130" y="555" font-family="Arial, sans-serif" font-size="14" fill="#212529">Ground (GND)</text>
  
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">Note: Internal pull-ups enabled in code.</text>

  <!-- Additional Notes -->
  <rect x="680" y="480" width="260" height="110" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">Important Notes</text>
  <text x="700" y="525" font-family="Arial, sans-serif" font-size="12" fill="#856404">• Connect to PC via Micro-USB</text>
  <text x="700" y="545" font-family="Arial, sans-serif" font-size="12" fill="#856404">• No external resistors required</text>
  <text x="700" y="565" font-family="Arial, sans-serif" font-size="12" fill="#856404">• Pins D16, D3, D5, D10 use</text>
  <text x="700" y="580" font-family="Arial, sans-serif" font-size="12" fill="#856404">  INPUT_PULLUP in software</text>

</svg>